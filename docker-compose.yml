services:
  db:
    image: postgres:15
    container_name: pfa-postgres
    environment:
      POSTGRES_USER: pfa_user
      POSTGRES_PASSWORD: pfa_pass
      POSTGRES_DB: pfa_db
    ports:
      - "55432:5432"
    volumes:
      - pfa-postgres-data:/var/lib/postgresql/data
  test-db:
    image: postgres:15
    container_name: pfa-postgres-test
    environment:
      POSTGRES_USER: pfa_user
      POSTGRES_PASSWORD: pfa_pass
      POSTGRES_DB: pfa_test_db
    ports:
      - "55532:5432"
    volumes:
      - pfa-postgres-test-data:/var/lib/postgresql/data
volumes:
  pfa-postgres-data:
  pfa-postgres-test-data:
